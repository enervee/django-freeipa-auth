[tox]
envlist =
    {py38,py39}-django{32,42}
    {py310}-django{32,42,52}
    {py311}-django{42,52}
skipsdist = {env:TOXBUILD:false}

[pytest]
python_files = */tests/*

[flake8]
exclude = */tests/*

[testenv]
deps =
    pytest-cov>=2.0.0,<4.0
    flake8>=3.3.0
    pytest>=7.0,<9.0
    pytest-django>=4.5,<5.0
    requests
    django32: Django>=3.2,<4.0
    django42: Django>=4.2,<5.0
    django52: Django>=5.2,<5.3

basepython =
    py38: python3.8
    py39: python3.9
    py310: python3.10
    py311: python3.11


setenv =
    LANG=en_US.UTF-8
    LANGUAGE=en_US:en
    LC_ALL=en_US.UTF-8
    DJANGO_SETTINGS_MODULE=test_settings
    PYTHONPATH={toxinidir}

whitelist_externals = true
commands =
    {env:TOXBUILD:flake8 freeipa_auth}
    py.test --liveserver {env:LIVERSERVER:''} -s --cov=freeipa_auth freeipa_auth/tests/
